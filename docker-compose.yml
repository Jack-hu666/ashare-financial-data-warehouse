# 只起 MySQL 8.0 结果库（项目一离线数仓的落地层）。
# 用法：docker compose up -d
services:
  mysql:
    image: mysql:8.0
    container_name: finance_dw_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root        # 与 src/config.py 中 MYSQL.password 保持一致
      MYSQL_DATABASE: finance_dw       # 首次启动自动建库
      TZ: Asia/Shanghai
    command:
      - --default-authentication-plugin=mysql_native_password   # 兼容 pymysql 免装 cryptography
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"      # 宿主机 3307（本机已有 mysqld 占用 3306）→ 容器 3306
    volumes:
      - mysql_data:/var/lib/mysql
      # 首次初始化时自动执行建表脚本（数据卷为空时生效）
      - ./sql/ddl.sql:/docker-entrypoint-initdb.d/01_ddl.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
